# Portable Codex preferences for this repository.
# Personal paths, generated runtime paths, credential-bearing MCP servers, and elevated permissions are omitted.

service_tier = "default"
sandbox_mode = "workspace-write"
model = "gpt-5.6-sol"
model_reasoning_effort = "low"

[desktop]
followUpQueueMode = "steer"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "persistent", "max"]

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[mcp_servers.shopify_dev]
command = "npx"
args = ["-y", "@shopify/dev-mcp@latest"]
